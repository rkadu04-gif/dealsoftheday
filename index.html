<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rohit ❤️ Nikita Wedding Countdown | 15 Feb 2027</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.container{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
max-width:500px;
width:100%;
}

h1{
font-size:32px;
color:#e91e63;
margin-bottom:10px;
}

.names{
font-size:28px;
font-weight:bold;
color:#d81b60;
margin-bottom:10px;
}

h2{
font-size:18px;
color:#444;
margin-bottom:25px;
}

.timer{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.box{
background:#ffe6ec;
padding:15px;
border-radius:15px;
}

.box span{
display:block;
font-size:28px;
font-weight:bold;
color:#e91e63;
}
