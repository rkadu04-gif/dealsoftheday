<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Our Wedding Countdown ❤️ | 15 Feb 2027</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.container{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
max-width:500px;
width:100%;
}

h1{
font-size:32px;
color:#e91e63;
margin-bottom:10px;
}

h2{
font-size:18px;
color:#444;
margin-bottom:25px;
}

.timer{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.box{
background:#ffe6ec;
padding:15px;
border-radius:15px;
}

.box span{
display:block;
font-size:28px;
font-weight:bold;
color:#e91e63;
}

.box small{
color:#555;
font-size:14px;
}

.footer{
margin-top:25px;
font-size:16px;
color:#666;
}

@media(max-width:500px){
.timer{
grid-template-columns:repeat(2,1fr);
}
}
</style>
</head>

<body>

<div class="container">
<h1>💍 Our Wedding Countdown</h1>
<h2>15 February 2027</h2>

<div class="timer">
<div class="box"><span id="days">0</span><small>Days</small></div>
<div class="box"><span id="hours">0</span><small>Hours</small></div>
<div class="box"><span id="minutes">0</span><small>Minutes</small></div>
<div class="box"><span id="seconds">0</span><small>Seconds</small></div>
</div>

<div class="footer">
❤️ Together Forever ❤️
</div>
</div>

<script>
const weddingDate = new Date("Feb 15, 2027 00:00:00").getTime();

setInterval(function(){
const now = new Date().getTime();
const gap = weddingDate - now;

const days = Math.floor(gap / (1000*60*60*24));
const hours = Math.floor((gap % (1000*60*60*24)) / (1000*60*60));
const minutes = Math.floor((gap % (1000*60*60)) / (1000*60));
const seconds = Math.floor((gap % (1000*60)) / 1000);

document.getElementById("days").innerText = days;
document.getElementById("hours").innerText = hours;
document.getElementById("minutes").innerText = minutes;
document.getElementById("seconds").innerText = seconds;

},1000);
</script>

</body>
</html>
